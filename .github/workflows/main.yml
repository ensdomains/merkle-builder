name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: 'bun test'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: |
          bun --version
          forge --version

      - name: Install Javascript dependencies
        run: bun i

      - name: Install Solidity dependencies
        run: forge i

      - name: Type check
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
